services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      STORAGE_BACKEND: upstash
      FILE_STORAGE_BACKEND: r2
      SYSTEM_ROOT: /app
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')); assert r['database']['connected'] and (r['worker']['running'] or r['worker'].get('standby'))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
